name: ci

# Every push and pull request. The suites need no network, no tokens and no
# services: they work in temporary directories against file:// remotes and
# stubbed clients, which is what makes them safe to run here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Versions
        # Printed because a suite that behaves differently on the runner than
        # on a workstation is the thing hardest to debug from a log alone.
        run: |
          bash --version | head -1
          git --version
          shellcheck --version | sed -n 2p
          # tidy's confirmation gate is exercised with no controlling terminal
          # (setsid) and with a real one (python's pty); the suite skips those
          # checks rather than failing if either is missing, so they are worth
          # seeing in the log.
          setsid --version
          python3 -c 'import pty; print("python pty ok")'

      - name: shellcheck
        # Globbed, not listed: a named list quietly stops covering the next
        # test file somebody adds.
        run: |
          shellcheck -S warning astromech.sh tests/*.sh

      - name: tests
        run: tests/run-all.sh
